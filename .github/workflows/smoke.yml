name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Step definitions bind to every feature
        # One behave dry run per folder: each scenario folder has steps of its own.
        run: python -m mobiletest.run --check
      - name: The example issue runs through the runner against the fake driver
        run: python tests/test_smoke.py
