name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Step definitions bind to every feature
        run: |
          for dir in features/*/*/; do
            python -m behave "$dir" --dry-run --no-summary --format progress
          done
      - name: The example issue runs through the runner against the fake driver
        run: python tests/test_smoke.py
